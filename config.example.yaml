server:
  poll_interval_seconds: 30
  max_concurrent: 1
  retry_limit: 3
  max_task_minutes: 45
  worktree_root: C:/path/to/agent-control-data/worktrees
  database: C:/path/to/agent-control-data/agent-control.db
  logs_dir: C:/path/to/agent-control-data/logs
  ui:                              # embedded web dashboard
    enabled: true
    host: 127.0.0.1
    port: 8787
    # token: <random-secret>        # required when exposed beyond loopback; gates all routes

projects:
  - repo: your-org/your-sandbox-repo
    local_repo: C:/path/to/your-sandbox-repo
    base_branch: main
    ready_label: agent-ready
    branch_prefix: agent/issue-
    review_mode: auto                # auto（默认）：每个 PR head 自动派独立评审 run；manual：不派评审，PR 停在 AWAITING_HUMAN 等人审人合
    pr_review: auto                  # auto（默认）：没有 issue 的 PR 也自动评审；manual：只评审打了 agent-review 标签的 PR
    checks:
      - argv: [node, --test]
        timeout_seconds: 300
        # platforms: [win32]         # optional — omit to run on every host; a
        #                            # check that excludes the host is SKIPped (never FAIL)

agent:
  provider: pi
  model: new-api/deepseek-v4.1-flash  # required — <provider>/<model id> from ~/.pi/agent/models.json
  # reasoning_effort: medium          # optional — Pi --thinking level; unset = Pi default
  # review_model: new-api/GLM-5.3-Flash  # optional — use a different model for review
  # review_reasoning_effort: low     # optional — override review thinking level
  env_deny:
    - GH_TOKEN
    - GITHUB_TOKEN
    - GH_ENTERPRISE_TOKEN
    - GITHUB_ENTERPRISE_TOKEN

approvals:
  auto_merge:
    enabled: false                   # 低危 PASS 自动合并（仅 review_mode: auto 的项目）；关闭则一律转人工处理
