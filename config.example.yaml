server:
  poll_interval_seconds: 30
  max_concurrent: 1
  retry_limit: 3
  max_task_minutes: 45
  worktree_root: C:/path/to/agent-control-data/worktrees
  database: C:/path/to/agent-control-data/agent-control.db
  logs_dir: C:/path/to/agent-control-data/logs

projects:
  - repo: your-org/your-sandbox-repo
    local_repo: C:/path/to/your-sandbox-repo
    base_branch: main
    ready_label: agent-ready
    branch_prefix: agent/issue-
    checks:
      - argv: [node, --test]
        timeout_seconds: 300
  # isolation: docker runs this project's coder/reviewer/checks inside the
  # container image below (volume+tar sync to the daemon; host git/publish
  # untouched). checks.argv must then exist INSIDE the image.
  # - repo: your-org/python-service
  #   local_repo: D:/path/to/python-service
  #   isolation: docker
  #   checks:
  #     - argv: [uv, run, pytest]

agent:
  provider: pi                      # 'pi' (tool-allowlist confinement) | 'codex' (-s sandbox flag)
  model: new-api/deepseek-v4.1-flash  # required — pi: <provider>/<model id> from models.json; codex: -m value
  # reasoning_effort: medium          # optional — pi --thinking / codex model_reasoning_effort; unset = runner default
  sandbox: danger-full-access          # codex only (coder)
  review_sandbox: danger-full-access   # codex only (reviewer); pi review is read-only via tools
  # review_provider: codex           # optional — run the reviewer on a different runner+model
  # review_model: new-api/GLM-5.3-Flash  # (heterogeneous review decorrelates failures)
  # review_reasoning_effort: low     # optional — e.g. cheaper/faster review
  # isolation: none                  # global default; projects[].isolation overrides per-project
  # container:                       # required (with image) when any isolation=docker
  #   image: agent-control-dev:latest  # build via docker/Dockerfile
  #   host: tcp://192.168.1.199:2375   # optional DOCKER_HOST for the docker CLI
  #   network: bridge                  # optional docker run --network
  #   extra_args: []                   # appended to every docker run
  env_deny:
    - GH_TOKEN
    - GITHUB_TOKEN
    - GH_ENTERPRISE_TOKEN
    - GITHUB_ENTERPRISE_TOKEN

approvals:
  require_design_approval: true
  require_manual_merge: true
  allow_auto_deploy: false
