server:
  poll_interval_seconds: 30
  max_concurrent: 1
  retry_limit: 3
  max_task_minutes: 45
  worktree_root: C:/Users/zhangqianfeng/git/agent-control-data/worktrees
  database: C:/Users/zhangqianfeng/git/agent-control-data/agent-control.db
  logs_dir: C:/Users/zhangqianfeng/git/agent-control-data/logs

projects:
  - repo: duyiliu/agent-control-sandbox
    local_repo: C:/Users/zhangqianfeng/git/agent-control-sandbox
    base_branch: main
    ready_label: agent-ready
    branch_prefix: agent/issue-
    checks:
      - argv: [node, --test]
        timeout_seconds: 300

agent:
  provider: pi                    # 'pi' | 'claude' (tool-allowlist confinement) | 'codex' (sandbox flag)
  model: new-api/deepseek-v4.1-flash  # pi: provider/model from ~/.pi/agent/models.json; claude/codex: --model value
  sandbox: danger-full-access          # codex only
  review_sandbox: danger-full-access   # codex only; pi/claude review is read-only via tools
  # claude_env:                      # claude only: injected via --settings, outranks ~/.claude/settings.json
  #   ANTHROPIC_BASE_URL: http://127.0.0.1:15721
  #   ANTHROPIC_AUTH_TOKEN: PROXY_MANAGED
  env_deny:
    - GH_TOKEN
    - GITHUB_TOKEN
    - GH_ENTERPRISE_TOKEN
    - GITHUB_ENTERPRISE_TOKEN

approvals:
  require_design_approval: true
  require_manual_merge: true
  allow_auto_deploy: false
